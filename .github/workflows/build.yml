name: Build and Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Determine release version
      id: release_version
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ -z "${version}" ] || [ "${version}" = "${GITHUB_REF_NAME}" ]; then
          version="dev"
        fi
        echo "value=${version}" >> "$GITHUB_OUTPUT"
        printf '%s\n' "${version}" > VERSION

    - name: Install Dependencies
      shell: bash
      run: |
        pip install -r requirements.txt
        pip install pyinstaller==6.20.0 pillow==12.2.0

    # The options window needs Tk bundled on every platform — fail loudly here
    # rather than shipping a binary that silently falls back to console mode.
    - name: Verify Tk is available for the options window
      shell: bash
      run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

    - name: Generate release icon
      shell: bash
      run: python tools/build_icon.py

    - name: Build with PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile --name EDOPro-HD-Sync --icon build/app-icon.ico --collect-data certifi --add-data "VERSION${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "assets/app-icon.png${{ matrix.os == 'windows-latest' && ';' || ':' }}." main.py

    - name: Smoke test packaged binary
      shell: bash
      run: |
        binary="dist/EDOPro-HD-Sync"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          binary="${binary}.exe"
        fi
        "$binary" --health-check --quiet

    - name: Check Windows signing configuration
      if: matrix.os == 'windows-latest'
      id: windows_signing
      shell: pwsh
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
        TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
      run: |
        $required = @{
          "AZURE_CLIENT_ID" = $env:AZURE_CLIENT_ID
          "AZURE_CLIENT_SECRET" = $env:AZURE_CLIENT_SECRET
          "AZURE_TENANT_ID" = $env:AZURE_TENANT_ID
          "TRUSTED_SIGNING_ACCOUNT_NAME" = $env:TRUSTED_SIGNING_ACCOUNT_NAME
          "TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" = $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
          "TRUSTED_SIGNING_ENDPOINT" = $env:TRUSTED_SIGNING_ENDPOINT
        }

        $missing = @(
          $required.GetEnumerator() |
          Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
          ForEach-Object { $_.Key } |
          Sort-Object
        )

        if ($missing.Count -gt 0) {
          "enabled=false" >> $env:GITHUB_OUTPUT
          Write-Warning "Windows signing is not configured. Missing: $($missing -join ', ')"
        } else {
          "enabled=true" >> $env:GITHUB_OUTPUT
        }

    - name: Warn when Windows release is unsigned
      if: matrix.os == 'windows-latest' && steps.windows_signing.outputs.enabled != 'true'
      shell: bash
      run: |
        echo "::warning::Windows signing is not configured. Smart App Control may block this executable."
        echo "::warning::Set repo secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID and repo variables TRUSTED_SIGNING_ACCOUNT_NAME, TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME, TRUSTED_SIGNING_ENDPOINT."

    - name: Sign Windows executable
      if: matrix.os == 'windows-latest' && steps.windows_signing.outputs.enabled == 'true'
      uses: azure/trusted-signing-action@v0.5.10
      with:
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
        certificate-profile-name: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        files-folder: ${{ github.workspace }}\dist
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $version = "${{ steps.release_version.outputs.value }}"
        $bundleDir = "dist/EDOPro HD Sync"
        $archive = "dist/EDOPro-HD-Sync-Windows-v$version.zip"
        if (Test-Path $bundleDir) { Remove-Item $bundleDir -Recurse -Force }
        if (Test-Path $archive) { Remove-Item $archive -Force }
        New-Item -ItemType Directory -Path "$bundleDir/app" | Out-Null
        Copy-Item "dist/EDOPro-HD-Sync.exe" -Destination "$bundleDir/app/EDOPro-HD-Sync.exe"
        Set-Content -LiteralPath "$bundleDir/app/version.txt" -Value "v$version" -NoNewline
        Copy-Item "EDOPro-HD-Sync.bat" -Destination "$bundleDir/EDOPro-HD-Sync.bat"
        Copy-Item "release_assets/ReadMe-Windows.txt" -Destination "$bundleDir/ReadMe.txt"
        Compress-Archive -Path $bundleDir -DestinationPath $archive -Force

    # zip (unlike a raw browser download) preserves the executable bit, which is
    # why the launcher ships inside an archive rather than as a bare file.
    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        archive="EDOPro-HD-Sync-macOS-v${version}.zip"
        bundleDir="dist/EDOPro HD Sync"

        rm -rf "$bundleDir" "dist/$archive"
        mkdir -p "$bundleDir/app"

        mv dist/EDOPro-HD-Sync "$bundleDir/app/EDOPro-HD-Sync-macOS"
        chmod +x "$bundleDir/app/EDOPro-HD-Sync-macOS"
        printf 'v%s' "$version" > "$bundleDir/app/version.txt"

        cp EDOPro-HD-Sync.command "$bundleDir/EDOPro-HD-Sync.command"
        chmod +x "$bundleDir/EDOPro-HD-Sync.command"
        cp release_assets/ReadMe-MacOS.txt "$bundleDir/ReadMe.txt"

        cd dist && zip -r "$archive" "EDOPro HD Sync"

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        archive="EDOPro-HD-Sync-Linux-v${version}.zip"
        bundleDir="dist/EDOPro HD Sync"

        rm -rf "$bundleDir" "dist/$archive"
        mkdir -p "$bundleDir/app"

        mv dist/EDOPro-HD-Sync "$bundleDir/app/EDOPro-HD-Sync-Linux"
        chmod +x "$bundleDir/app/EDOPro-HD-Sync-Linux"
        printf 'v%s' "$version" > "$bundleDir/app/version.txt"

        cp EDOPro-HD-Sync.sh "$bundleDir/EDOPro-HD-Sync.sh"
        chmod +x "$bundleDir/EDOPro-HD-Sync.sh"
        cp release_assets/ReadMe-Linux.txt "$bundleDir/ReadMe.txt"

        cd dist && zip -r "$archive" "EDOPro HD Sync"

    - name: Verify the launcher kept its executable bit
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        case "${{ matrix.os }}" in
          macos-latest) archive="dist/EDOPro-HD-Sync-macOS-v${version}.zip"; launcher="EDOPro HD Sync/EDOPro-HD-Sync.command" ;;
          *)            archive="dist/EDOPro-HD-Sync-Linux-v${version}.zip"; launcher="EDOPro HD Sync/EDOPro-HD-Sync.sh" ;;
        esac
        rm -rf dist/_verify && mkdir -p dist/_verify
        unzip -q "$archive" -d dist/_verify
        if [ ! -x "dist/_verify/$launcher" ]; then
          echo "::error::Launcher is not executable inside the release zip - users would get a permissions error."
          exit 1
        fi
        echo "Launcher is executable inside the zip."

    - name: Determine release file
      id: release_file
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          echo "path=dist/EDOPro-HD-Sync-Windows-v${version}.zip" >> "$GITHUB_OUTPUT"
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          echo "path=dist/EDOPro-HD-Sync-macOS-v${version}.zip" >> "$GITHUB_OUTPUT"
        else
          echo "path=dist/EDOPro-HD-Sync-Linux-v${version}.zip" >> "$GITHUB_OUTPUT"
        fi

    # Exactly one asset per platform: Windows, macOS, Linux. Downloads are
    # verified against the SHA-256 digest GitHub publishes in its release API,
    # so no separate .sha256 files are needed.
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: EDOPro HD Sync v${{ steps.release_version.outputs.value }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: ${{ steps.release_file.outputs.path }}
