name: Build and Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.release_version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Determine release version
      id: release_version
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ -z "${version}" ] || [ "${version}" = "${GITHUB_REF_NAME}" ]; then
          version="dev"
        fi
        echo "value=${version}" >> "$GITHUB_OUTPUT"
        printf '%s\n' "${version}" > VERSION

    - name: Install Dependencies
      shell: bash
      run: |
        pip install -r requirements.txt
        pip install pyinstaller==6.20.0 pillow==12.2.0

    # The options window needs Tk bundled on every platform — fail loudly here
    # rather than shipping a binary that silently falls back to console mode.
    - name: Verify Tk is available for the options window
      shell: bash
      run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

    - name: Generate release icon
      shell: bash
      run: python tools/build_icon.py

    # --onefile, so the download unzips to exactly one runnable file plus the
    # ReadMe. It costs ~1.5s of extraction per launch versus --onedir; that is
    # the price of not making people hunt for an app inside a folder of 1,000
    # support files, and this tool is run occasionally, not all day.
    #
    # --windowed on Windows ONLY. A console build puts a black console window
    # behind the app on every double-click, which users reported as looking
    # broken. Do not "fix" that at runtime by hiding the window: that was
    # tried and it does not hold, because the console Explorer creates on a
    # double-click is not the same beast as the pseudo-console a terminal
    # hands you, so it cannot be tested from one. Not creating a console at
    # all is the only version of this that cannot regress. Output still
    # reaches a pipe or a terminal, which is what the smoke test below and
    # `--health-check` rely on. On macOS --windowed would build a .app bundle
    # instead of the single file the release needs, so it stays Windows-only.
    - name: Build with PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile ${{ matrix.os == 'windows-latest' && '--windowed' || '' }} --name EDOPro-HD-Sync --icon build/app-icon.ico --collect-data certifi --add-data "VERSION${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "assets/app-icon.png${{ matrix.os == 'windows-latest' && ';' || ':' }}." main.py

    # The PE subsystem byte is the difference between "double-click shows one
    # clean window" and "double-click shows a stray black console too".
    - name: Verify the Windows build creates no console
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $bytes = [System.IO.File]::ReadAllBytes("dist/EDOPro-HD-Sync.exe")
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
        $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
        # 2 = IMAGE_SUBSYSTEM_WINDOWS_GUI, 3 = IMAGE_SUBSYSTEM_WINDOWS_CUI
        if ($subsystem -ne 2) {
          Write-Host "::error::Windows build is a console app (subsystem $subsystem) - double-clicking it would open a stray console window."
          exit 1
        }
        Write-Host "Windows build is a GUI app: no console window on double-click."

    - name: Smoke test packaged binary
      shell: bash
      run: |
        binary="dist/EDOPro-HD-Sync"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          binary="${binary}.exe"
        fi
        "$binary" --health-check --quiet

    # NOTE: Windows code signing intentionally lives OUTSIDE this job.
    # GitHub downloads every action referenced by a job during "Set up job",
    # even steps gated behind an `if:` that is false — so keeping an unused
    # azure/trusted-signing-action here meant a codeload hiccup (429/503) could
    # fail every Windows release for a feature that was never enabled. When
    # signing is actually configured, add it as its OWN job guarded at the job
    # level (`if: vars.TRUSTED_SIGNING_ACCOUNT_NAME != ''`) so a skipped job
    # never fetches the action, passing the exe between jobs via artifacts.
    - name: Note that the Windows build is unsigned
      if: matrix.os == 'windows-latest'
      shell: bash
      run: echo "::warning::This Windows build is unsigned - SmartScreen may warn users. Configure Azure Trusted Signing to remove the warning."

    # Every zip holds exactly two things: the app and a ReadMe. Nothing to
    # install, nothing to dig through.
    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $version = "${{ steps.release_version.outputs.value }}"
        $bundleDir = "dist/EDOPro HD Sync"
        $archive = "dist/EDOPro-HD-Sync-Windows-v$version.zip"
        if (Test-Path $bundleDir) { Remove-Item $bundleDir -Recurse -Force }
        if (Test-Path $archive) { Remove-Item $archive -Force }
        New-Item -ItemType Directory -Path "$bundleDir" | Out-Null
        Move-Item "dist/EDOPro-HD-Sync.exe" -Destination "$bundleDir/EDOPro-HD-Sync.exe"
        Copy-Item "release_assets/ReadMe-Windows.txt" -Destination "$bundleDir/ReadMe.txt"
        Compress-Archive -Path $bundleDir -DestinationPath $archive -Force

    # zip (unlike a raw browser download) preserves the executable bit, which is
    # why the app ships inside an archive rather than as a bare file.
    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        archive="EDOPro-HD-Sync-macOS-v${version}.zip"
        bundleDir="dist/EDOPro HD Sync"

        rm -rf "$bundleDir" "dist/$archive"
        mkdir -p "$bundleDir"

        mv dist/EDOPro-HD-Sync "$bundleDir/EDOPro-HD-Sync"
        chmod +x "$bundleDir/EDOPro-HD-Sync"
        cp release_assets/ReadMe-MacOS.txt "$bundleDir/ReadMe.txt"

        cd dist && zip -r "$archive" "EDOPro HD Sync"

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        archive="EDOPro-HD-Sync-Linux-v${version}.zip"
        bundleDir="dist/EDOPro HD Sync"

        rm -rf "$bundleDir" "dist/$archive"
        mkdir -p "$bundleDir"

        mv dist/EDOPro-HD-Sync "$bundleDir/EDOPro-HD-Sync"
        chmod +x "$bundleDir/EDOPro-HD-Sync"
        cp release_assets/ReadMe-Linux.txt "$bundleDir/ReadMe.txt"

        cd dist && zip -r "$archive" "EDOPro HD Sync"

    # The whole promise of the download is "unzip, double-click". Fail the
    # build if a zip ever grows a third entry or loses its executable bit.
    - name: Verify the zip is just the app and a ReadMe
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        case "${{ matrix.os }}" in
          windows-latest) archive="dist/EDOPro-HD-Sync-Windows-v${version}.zip"; app="EDOPro HD Sync/EDOPro-HD-Sync.exe" ;;
          macos-latest)   archive="dist/EDOPro-HD-Sync-macOS-v${version}.zip";   app="EDOPro HD Sync/EDOPro-HD-Sync" ;;
          *)              archive="dist/EDOPro-HD-Sync-Linux-v${version}.zip";   app="EDOPro HD Sync/EDOPro-HD-Sync" ;;
        esac

        rm -rf dist/_verify && mkdir -p dist/_verify
        unzip -q "$archive" -d dist/_verify

        files="$(cd dist/_verify && find . -type f | sort)"
        count="$(printf '%s\n' "$files" | wc -l | tr -d ' ')"
        if [ "$count" != "2" ]; then
          echo "::error::Expected 2 files in the zip (the app and ReadMe.txt), found ${count}:"
          printf '%s\n' "$files"
          exit 1
        fi
        if [ ! -f "dist/_verify/$app" ] || [ ! -f "dist/_verify/EDOPro HD Sync/ReadMe.txt" ]; then
          echo "::error::The zip does not contain the app and ReadMe.txt at the top level:"
          printf '%s\n' "$files"
          exit 1
        fi
        if [ "${{ matrix.os }}" != "windows-latest" ] && [ ! -x "dist/_verify/$app" ]; then
          echo "::error::The app is not executable inside the zip - users would get a permissions error."
          exit 1
        fi
        echo "Zip contains exactly the app and ReadMe.txt."

    - name: Determine release file
      id: release_file
      shell: bash
      run: |
        version="${{ steps.release_version.outputs.value }}"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          echo "path=dist/EDOPro-HD-Sync-Windows-v${version}.zip" >> "$GITHUB_OUTPUT"
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          echo "path=dist/EDOPro-HD-Sync-macOS-v${version}.zip" >> "$GITHUB_OUTPUT"
        else
          echo "path=dist/EDOPro-HD-Sync-Linux-v${version}.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Hand the zip to the release job
      uses: actions/upload-artifact@v4
      with:
        name: zip-${{ matrix.os }}
        path: ${{ steps.release_file.outputs.path }}
        if-no-files-found: error

  # Publishing happens once, here, and never inside the matrix. Three parallel
  # jobs each creating the same release raced on v5.2.0: two won, macOS died
  # with "Too many retries" and its zip never got attached, and the release
  # notes were generated twice. One job, one release, all three zips.
  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Collect every platform's zip
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: zip-*
        merge-multiple: true

    # Exactly one asset per platform: Windows, macOS, Linux. Downloads are
    # verified against the SHA-256 digest GitHub publishes in its release API,
    # so no separate .sha256 files are needed.
    - name: Check all three platforms are present before publishing
      shell: bash
      run: |
        version="${{ needs.build.outputs.version }}"
        missing=0
        for platform in Windows macOS Linux; do
          if [ ! -f "dist/EDOPro-HD-Sync-${platform}-v${version}.zip" ]; then
            echo "::error::Missing the ${platform} download - refusing to publish a partial release."
            missing=1
          fi
        done
        ls -la dist
        exit "$missing"

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        name: EDOPro HD Sync v${{ needs.build.outputs.version }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: dist/*.zip
